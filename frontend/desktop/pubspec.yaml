name: openlucid
description: "OpenLucid: listens to your sleep through a Muse EEG headband and plays a sound cue during REM."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  desktop_updater: ^1.4.0
  http: ^1.6.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  universal_ble: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo-mark-256.png

# App icons, generated from ../../branding (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "../../branding/icon-1024.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#0C1124"
  adaptive_icon_foreground: "../../branding/icon-transparent-1024.png"
  windows:
    generate: true
    image_path: "../../branding/icon-1024.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "../../branding/icon-1024.png"
