baseURL = "https://openlucid.nl/"
languageCode = "en"
title = "OpenLucid"
disableKinds = ["taxonomy", "term"]

[params]
  tagline = "An open-source dream machine you can build yourself"
  description = "OpenLucid listens to your sleep through a Muse EEG headband and whispers a sound cue when you are probably dreaming. Free, local, open source. Educational, not medical advice."
  repo = "https://github.com/emolionl/openlucid"

[markup.goldmark.renderer]
  unsafe = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2
  ordered = false

# The journey and the video scripts live elsewhere in the repository (so they read well on GitHub too);
# Hugo mounts them into the website.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../docs/journey"
    target = "content/journey"
    excludeFiles = ["README.md"]
  [[module.mounts]]
    source = "../docs/journey/README.md"
    target = "content/journey/_index.md"
  [[module.mounts]]
    source = "../promotion/video-scripts"
    target = "content/videos"
  [[module.mounts]]
    source = "../docs/research"
    target = "content/research"
    excludeFiles = ["README.md"]
  [[module.mounts]]
    source = "../docs/research/README.md"
    target = "content/research/_index.md"

[[menus.main]]
  name = "Journey"
  pageRef = "/journey"
  weight = 1

[[menus.main]]
  name = "Videos"
  pageRef = "/videos"
  weight = 2

[[menus.main]]
  name = "Research"
  pageRef = "/research"
  weight = 3

[[menus.main]]
  name = "Docs"
  pageRef = "/docs"
  weight = 4

[[menus.main]]
  name = "GitHub"
  url = "https://github.com/emolionl/openlucid"
  weight = 4
