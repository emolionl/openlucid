<!doctype html>
<html lang="{{ site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }} — {{ site.Params.tagline }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <style>
    :root { color-scheme: dark; --bg: #12142a; --text: #e6e8f2; --muted: #a3a8c3; --accent: #8c98ff; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header, main, footer { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-top: 20px; }
    header a { color: var(--text); text-decoration: none; font-weight: 600; }
    nav a { margin-left: 18px; font-weight: 400; color: var(--muted); }
    a { color: var(--accent); }
    h1 { font-size: 2.2rem; line-height: 1.2; }
    pre { background: #1d2040; padding: 14px; border-radius: 8px; overflow-x: auto; }
    code { font-size: 0.92em; }
    footer { color: var(--muted); font-size: 0.85rem; padding: 40px 16px; }
    table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #2a2d55; vertical-align: top; }
    blockquote { margin: 0 0 1em; padding: 4px 16px; border-left: 3px solid var(--accent); color: #c9cdf0; }
    .cards { list-style: none; padding: 0; }
    .cards li { background: #1a1d3a; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
    .cards p { margin: 6px 0 0; color: var(--muted); }
    .tag { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: #2a2d55; color: var(--muted); margin-left: 6px; }
    .meta, .crumb { color: var(--muted); font-size: 0.9rem; margin: 0; }
    nav { display: flex; flex-wrap: wrap; justify-content: flex-end; }
    @media (max-width: 520px) { header { flex-direction: column; align-items: flex-start; gap: 8px; } nav a { margin: 0 14px 0 0; } }
  </style>
</head>
<body>
  <header>
    <a href="{{ "/" | relURL }}">🌙 {{ site.Title }}</a>
    <nav>{{ range site.Menus.main }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}</nav>
  </header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer>OpenLucid is free and open source (MIT). Educational, not medical advice: a Muse is not a medical device, and nothing here diagnoses or treats anything.</footer>
</body>
</html>
