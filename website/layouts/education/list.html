{{ define "main" }}
<section class="page">
  <h1 class="page-title">{{ .Title }}</h1>
  {{ with .Description }}<p class="page-lede">{{ . }}</p>{{ end }}
  <div class="prose">{{ .Content }}</div>
  <div class="path-list">
    {{ range $i, $p := .Params.paths }}
    <a class="path-item reveal" href="{{ $p.url | relURL }}">
      <span class="path-num">{{ add $i 1 }}</span>
      <span class="path-body">
        <span class="kicker">{{ $p.kicker }}</span>
        <h3>{{ $p.title }}</h3>
        <p>{{ $p.desc }}</p>
        <span class="more">{{ $p.linktext }}</span>
      </span>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
